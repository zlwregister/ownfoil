name: Build hardened NAS image
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hardened-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.14'
      - name: Test and audit resolved dependencies
        run: |
          uv venv
          uv pip install --require-hashes -r requirements.lock
          uv pip install pytest pip-audit
          uv run --no-project pytest tests -q
          uv run --no-project pip-audit
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke test, and publish amd64 image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          docker buildx build --platform linux/amd64 --load -t "$IMAGE:sha-$COMMIT" .
          mkdir -p smoke/config smoke/data
          sudo chown -R 1000:1000 smoke
          docker run -d --name smoke --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m -p 127.0.0.1:8465:8465 \
            -v "$PWD/smoke/config:/app/config" -v "$PWD/smoke/data:/app/data" \
            -e USER_ADMIN_NAME=smoke-admin -e USER_ADMIN_PASSWORD="$(openssl rand -hex 24)" \
            "$IMAGE:sha-$COMMIT"
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8465/login >/dev/null; then ready=1; break; fi
            sleep 2
          done
          docker logs smoke
          test "$ready" = 1
          test "$(docker exec smoke id -u)" != 0
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8465/login)" = 403
          docker rm -f smoke
          docker tag "$IMAGE:sha-$COMMIT" "$IMAGE:hardened"
          docker push "$IMAGE:sha-$COMMIT"
          docker push "$IMAGE:hardened"
          docker save -o ownfoil-ds218plus.tar "$IMAGE:sha-$COMMIT" "$IMAGE:hardened"
          sha256sum ownfoil-ds218plus.tar > ownfoil-ds218plus.tar.sha256
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:sha-$COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the Synology artifact, unzip it, then Docker > Image > Add > Add from file.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ownfoil-synology-amd64
          path: |
            ownfoil-ds218plus.tar
            ownfoil-ds218plus.tar.sha256
          retention-days: 14
